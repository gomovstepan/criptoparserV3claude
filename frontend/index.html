<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="ArbitrageHub — панель мониторинга межбиржевого крипто-арбитража: спреды, paper-сделки, P&amp;L и статус бирж в реальном времени." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0a14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a14'/%3E%3Cg stroke='%2300d4aa' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round' fill='none'%3E%3Cpath d='M7 12h15M18 8l4 4-4 4'/%3E%3Cpath d='M25 20H10M14 16l-4 4 4 4'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>ArbitrageHub — крипто-арбитраж</title>
    <!-- Тема применяется ДО первой отрисовки, иначе светлая тема мигает тёмной.
         Дублирует themeStore.apply(), но выполняется раньше загрузки бандла. -->
    <script>
      ;(function () {
        try {
          // Логика значения обязана совпадать с themeStore.readInitial():
          // без matchMedia первый визит со светлой системной темой мигал тёмной.
          var s = localStorage.getItem('theme')
          var t =
            s === 'light' || s === 'dark'
              ? s
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          var el = document.documentElement
          el.classList.toggle('light', t === 'light')
          el.classList.toggle('dark', t === 'dark')
        } catch (e) {
          /* localStorage недоступен — остаётся тёмная тема по умолчанию */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">
        Для работы панели требуется включённый JavaScript.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
